[project]
name = "push2xteink"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6",
    "ruamel.yaml>=0.18",
    "apscheduler>=3.10,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/push2xteink"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
