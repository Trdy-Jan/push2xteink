[project]
name = "push2xteink"
version = "0.1.0"
description = "自动把 RSS 新文章打包推送到 xteink 阅读器：抓取 / 可选 AI 摘要 / EPUB·TXT / 定时"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "push2xteink" }]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6",
    "certifi>=2024.0",
    "ruamel.yaml>=0.18",
    "apscheduler>=3.10,<4",
    "httpx>=0.27",
    "feedparser>=6.0",
    "trafilatura>=1.8",
    "lxml>=5.0",
    "ebooklib>=0.18",
    "fastapi>=0.110,<0.116",
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "respx>=0.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/push2xteink"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
