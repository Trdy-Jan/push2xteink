services:
  push2xteink:
    build:
      context: .
      args:
        # 国内构建加速；海外/CI 在 .env 里设为空 / 官方源即可
        APT_MIRROR: "${APT_MIRROR-mirrors.tuna.tsinghua.edu.cn}"
        PIP_INDEX_URL: "${PIP_INDEX_URL-https://pypi.tuna.tsinghua.edu.cn/simple}"
    image: push2xteink:local
    restart: unless-stopped
    init: true                       # tini: reap zombies + forward SIGTERM
    stop_grace_period: 150s          # ~25s 优雅排空(web/app.py _WEB_DRAIN_TIMEOUT) + 余量
    user: "${APP_UID:-10001}:${APP_GID:-10001}"
    ports:
      - "${PORT:-8080}:8080"
    environment:
      PORT: "8080"
      TZ: "${TZ:-UTC}"
      WEB_PASSWORD: "${WEB_PASSWORD:-}"
      CONFIG_PATH: /data/config.yaml
      DB_PATH: /data/state.db
    volumes:
      - ./data:/data
