<tr id="task-row-{{ t.id }}">
  <td data-label="名称"><strong>{{ t.name }}</strong></td>
  <td data-label="下次执行">{{ t.next_run_time | ts }}</td>
  <td data-label="状态">
    <span class="badge {{ t.badge_class }}">{{ t.badge_text }}</span>
    {% if triggered|default(false) %}<span class="hint hint--inline">已触发</span>{% endif %}
  </td>
  <td data-label="启用">
    <button hx-post="/tasks/{{ t.id }}/toggle"
            hx-target="#task-row-{{ t.id }}" hx-swap="outerHTML">
      {{ "已启用" if t.enabled else "已停用" }}
    </button>
  </td>
  <td class="cell-actions" data-label="操作">
    <button hx-post="/tasks/{{ t.id }}/run"
            hx-target="#task-row-{{ t.id }}" hx-swap="outerHTML">立即执行</button>
    <button hx-get="/tasks/{{ t.id }}/edit"
            hx-target="#task-form" hx-swap="innerHTML">编辑</button>
    <button class="btn-danger" hx-delete="/tasks/{{ t.id }}"
            hx-target="#task-row-{{ t.id }}" hx-swap="outerHTML"
            hx-confirm="删除任务 {{ t.name }}？">删除</button>
  </td>
</tr>
